name: Publish approved Foggy changes
on:
  push:
    paths:
      - '.github/scripts/upgrade-foggy.py'
      - '.github/workflows/upgrade-foggy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/upgrade-foggy.py
      - name: Commit Foggy changes
        run: |
          if ! git diff --quiet -- foggy/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add foggy/index.html
            git commit -m "Foggy: add earned letters and clue reminder"
            git push
          fi
