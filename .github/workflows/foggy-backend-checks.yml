name: Foggy isolated backend checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/foggy-backend-checks.yml'
permissions:
  contents: read
jobs:
  verify-foggy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foggy-companion
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Foggy verification function TypeScript
        run: deno check supabase/functions/foggy-etsy-verify/index.ts
      - name: Run Foggy mocked purchase verification tests
        run: deno test supabase/functions/foggy-etsy-verify/receipt_rules_test.ts
