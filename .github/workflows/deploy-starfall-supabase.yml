name: Deploy STARFALL Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ENV: production
      ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
      ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Push database migrations
        run: supabase db push --remote=${{ vars.PROJECT_REF }} --yes

      - name: Set Etsy Edge Function secrets
        run: supabase secrets set ETSY_KEYSTRING="$ETSY_KEYSTRING" ETSY_SHARED_SECRET="$ETSY_SHARED_SECRET" --project-ref=${{ vars.PROJECT_REF }} --yes

      - name: Deploy Edge Functions
        run: supabase functions deploy --remote=${{ vars.PROJECT_REF }} --yes
